<text x="1048" y="502" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.7">MODEL CALL</text>
<rect x="997.76" y="553" width="100.48" height="20" fill="#FFFFFF"/>
<text x="1048" y="568" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.7">DRAFT RESULT</text>
<rect x="291.52" y="716" width="184.96" height="21" fill="#FFFFFF"/>
<text x="384" y="732" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.7">SCOPED TASK + GUIDANCE</text>
<rect x="511.68" y="776" width="192.64000000000001" height="21" fill="#FFFFFF"/>
<text x="608" y="792" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.7">TYPED RESULT + EVIDENCE</text>
