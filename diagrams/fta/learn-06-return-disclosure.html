<text x="64" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">FTA / AGENTIC AI / GITEX / LEARNING GUIDE</text>
<text x="64" y="92" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">Scenario playbooks: reconciliation and disclosure</text>
<text x="64" y="128" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Period allocation and arithmetic come from approved definitions and tools; the agents explain and coordinate.</text>
<text x="1536" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end" letter-spacing="1">PROPOSED · 23 NOV 2026</text>
<text x="64" y="208" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">SCENARIO 2 / RETURN MISMATCH</text>
<text x="64" y="244" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Al Yasmeen: explain the AED 412,000 net discrepancy</text>
<text x="64" y="273" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Separate the accounting cut-off difference from the Emirate reallocation instead of treating them as one cause.</text>
<rect data-node-id="Evidence-and-deterministic-checks" x="64" y="312" width="432" height="208" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="88" y="346" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">Evidence and deterministic checks</text>
<text x="88" y="374" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">38 invoices in the draft investigation</text>
<text x="88" y="398" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">34 cut-off invoices: AED 412,000</text>
<text x="88" y="422" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">4 branch-allocation invoices: AED 74,200</text>
<text x="88" y="446" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Dubai adjustment: +AED 486,200</text>
<text x="88" y="470" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Abu Dhabi adjustment: −AED 74,200</text>
<rect data-node-id="Agent-tasks-and-guidance" x="584" y="312" width="432" height="208" rx="6" fill="#EEF7F4" stroke="#14665E" stroke-width="1.25"/>
<text x="608" y="346" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">Agent tasks and guidance</text>
<text x="608" y="374" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Load return-box and reconciliation guidance</text>
<text x="608" y="398" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Retrieve invoice, return and ledger evidence</text>
<text x="608" y="422" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Use tools for the box-by-box calculations</text>
<text x="608" y="446" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Draft an inspector request or business reply</text>
<text x="608" y="470" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Explain the adjustment without double counting</text>
<rect data-node-id="Approved-action-and-outcome" x="1104" y="312" width="432" height="208" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="1128" y="346" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">Approved action and outcome</text>
<text x="1128" y="374" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Preview and approve the demo disclosure</text>
<text x="1128" y="398" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Apply the agreed return-box changes</text>
<text x="1128" y="422" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Reconcile the new return against invoices</text>
<text x="1128" y="446" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Show one case history in both role views</text>
<text x="1128" y="470" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Return actual status, including partial resolution</text>
<text x="64" y="572" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">BRANCHES / WHAT YOUR IMPLEMENTATION MUST HANDLE</text>
<text x="64" y="612" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A net correction can still leave an Emirate allocation unresolved; check both.</text>
<text x="64" y="644" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Explanation-only, no reply, more-time and audit branches need explicit permitted transitions.</text>
<text x="64" y="760" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">SCENARIO 4 / MISSING DISCLOSURE</text>
<text x="64" y="796" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Al Saqr: allocate the invoices to the correct period and count VAT once</text>
<text x="64" y="825" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The draft identifies September supplies invoiced after the Q3 filing and included in the Q4 draft.</text>
<rect data-node-id="Evidence-and-deterministic-checks" x="64" y="864" width="432" height="208" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="88" y="898" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">Evidence and deterministic checks</text>
<text x="88" y="926" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">11 invoices: AED 162,400 VAT</text>
<text x="88" y="950" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Supply, issue, ledger and filing dates</text>
<text x="88" y="974" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Q3 Box 1c: 318,600 → 481,000</text>
<text x="88" y="998" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Q4 draft: 402,900 → 240,500</text>
<text x="88" y="1022" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Applicable deadline from an approved rule tool</text>
<rect data-node-id="Agent-tasks-and-guidance" x="584" y="864" width="432" height="208" rx="6" fill="#EEF7F4" stroke="#14665E" stroke-width="1.25"/>
<text x="608" y="898" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">Agent tasks and guidance</text>
<text x="608" y="926" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Load period-allocation and disclosure sections</text>
<text x="608" y="950" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Explain which dates drive the classification</text>
<text x="608" y="974" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Prepare Q3 changes and the Q4 adjustment</text>
<text x="608" y="998" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Draft reminder / response with source invoices</text>
<text x="608" y="1022" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Identify contradictions rather than accepting a claim</text>
<rect data-node-id="Approved-action-and-outcome" x="1104" y="864" width="432" height="208" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="1128" y="898" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">Approved action and outcome</text>
<text x="1128" y="926" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Visitor approves the proposed changes</text>
<text x="1128" y="950" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Submit the demo disclosure</text>
<text x="1128" y="974" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Remove the same items from the Q4 draft</text>
<text x="1128" y="998" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Verify the combined VAT is counted once</text>
<text x="1128" y="1022" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Record submission status and any open review</text>
<text x="64" y="1124" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">BRANCHES / WHAT YOUR IMPLEMENTATION MUST HANDLE</text>
<text x="64" y="1164" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">An alternative period claim must be checked against evidence and approved policy.</text>
<text x="64" y="1196" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Do not let an LLM independently invent legal deadlines, penalties or the filing obligation.</text>
<text x="64" y="1408" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">All amounts and behaviors are from the synthetic demonstration draft. Tax interpretations and action policy require domain-owner approval.</text>
<text x="88" y="1492" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WORKED EXAMPLE / READ FROM TOP TO BOTTOM</text>
<text x="88" y="1528" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Two corrections where getting the total right is not enough</text>
<text x="88" y="1566" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Reconciliation: “Can I just add 412,000?” Disclosure: “Why adjust both Q3 and Q4?”</text>
<text x="88" y="1634" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">STEP / WHO ACTS</text>
<text x="360" y="1634" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WHAT THEY ACTUALLY DO</text>
<text x="1032" y="1634" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WHAT COMES BACK / WHY IT MATTERS</text>
<text x="88" y="1687" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">01</text>
<text x="136" y="1686" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Return / Investigate</text>
<text x="360" y="1684" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Al Yasmeen proposes adding 412,000 only to Dubai. Retrieve the 34</text>
<text x="360" y="1709" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">cut-off and 4 allocation invoice findings before accepting the</text>
<text x="360" y="1734" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">proposal.</text>
<text x="1032" y="1684" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The net amount is plausible, but the suggested</text>
<text x="1032" y="1709" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">change misses the Emirate allocation.</text>
<text x="88" y="1807" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">02</text>
<text x="136" y="1806" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Return / Calculate</text>
<text x="360" y="1804" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Apply the approved box-level definition: Dubai increases by 486,200</text>
<text x="360" y="1829" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">and Abu Dhabi decreases by 74,200.</text>
<text x="1032" y="1804" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Net +412,000 and the correct allocation. Both</text>
<text x="1032" y="1829" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">must reconcile.</text>
<text x="88" y="1927" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">03</text>
<text x="136" y="1926" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Return / Act</text>
<text x="360" y="1924" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Preview the box changes, obtain approval, submit the demo</text>
<text x="360" y="1949" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">correction and compare the resulting boxes to invoice evidence.</text>
<text x="1032" y="1924" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Close only the resolved findings; retain any</text>
<text x="1032" y="1949" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">remaining allocation discrepancy.</text>
<text x="88" y="2047" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">04</text>
<text x="136" y="2046" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Disclosure /</text>
<text x="136" y="2071" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Investigate</text>
<text x="360" y="2044" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Al Saqr asks about 11 invoices with 162,400 VAT. Retrieve supply,</text>
<text x="360" y="2069" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">issue and filing dates and the Q4 draft entries.</text>
<text x="1032" y="2044" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Draft evidence places the supplies in September;</text>
<text x="1032" y="2069" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">the same items are also in Q4.</text>
<text x="88" y="2167" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">05</text>
<text x="136" y="2166" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Disclosure / Calculate</text>
<text x="360" y="2164" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Using the approved period rule, prepare Q3 Box 1c: 318,600 +</text>
<text x="360" y="2189" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">162,400; Q4 draft: 402,900 − 162,400.</text>
<text x="1032" y="2164" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Q3 becomes 481,000. Q4 becomes 240,500. Combined</text>
<text x="1032" y="2189" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">total remains 721,500.</text>
<text x="88" y="2287" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">06</text>
<text x="136" y="2286" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Disclosure / Act</text>
<text x="360" y="2284" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Show both changes for approval, submit the demo disclosure and</text>
<text x="360" y="2309" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">verify the same invoice IDs are removed from the Q4 draft.</text>
<text x="1032" y="2284" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The affected VAT is allocated to the intended</text>
<text x="1032" y="2309" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">period and counted once across Q3 and Q4.</text>
<text x="64" y="2414" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">What to remember</text>
<text x="64" y="2446" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Verify the correct boxes and periods as well as the final number. Correct tax counted in the wrong place is still an unresolved finding.</text>
<text x="64" y="2494" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Worked examples use the supplied synthetic draft. Tool behavior and interfaces are proposed; these are not live taxpayer operations.</text>
</svg></div></main></body></html>
