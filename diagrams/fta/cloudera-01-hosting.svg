<text x="64" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">FTA / AGENTIC AI / CLOUDERA / HOSTING GUIDE</text>
<text x="64" y="92" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">Where our agents would run on Cloudera</text>
<text x="64" y="128" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Reference proposal: Cloudera AI on Cloud for a protected GITEX demo; the actual FTA edition and release must be confirmed.</text>
<text x="1536" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end" letter-spacing="1">PROPOSED · 23 NOV 2026</text>
<text x="88" y="216" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Release check: AI Studios is labelled Technical Preview in the reviewed overview. Agree the supported deployment path with Cloudera.</text>
<rect data-node-id="browser" x="96" y="268" width="400" height="88" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="120" y="302" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">GITEX browser / approved user</text>
<text x="120" y="330" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Business or Inspector view; selected case</text>
<text x="640" y="424" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">CLOUDERA AI WORKBENCH / AUTHENTICATED PROJECT</text>
<rect data-node-id="frontend" x="96" y="456" width="400" height="192" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="120" y="490" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Workbench Application</text>
<text x="120" y="518" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Our custom screens + server-side adapter</text>
<text x="120" y="542" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Trusted role, company and case context</text>
<text x="120" y="566" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Preview / approve / cancel controls</text>
<text x="120" y="590" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Calls workflow; displays progress and results</text>
<rect data-node-id="agent-runtime" x="640" y="456" width="864" height="240" rx="6" fill="#EEF7F4" stroke="#14665E" stroke-width="1.25"/>
<text x="664" y="490" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Workbench Model endpoint — agent workflow</text>
<text x="664" y="518" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Supervisor + Data / Calculation / Knowledge / Explanation / Action tasks</text>
<text x="664" y="542" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">CPU workflow code and local tool functions; not one machine per agent</text>
<text x="664" y="566" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Load Ali’s approved section files before planning and specialist execution</text>
<text x="664" y="590" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Validate plans, tool requests and evidence; keep credentials server-side</text>
<text x="664" y="614" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Deploy one pinned release of workflow, tool code and instruction versions</text>
<text x="96" y="700" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Agent Studio authors/publishes the workflow.</text>
<text x="96" y="728" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Ops &amp; Metrics / Phoenix records run traces.</text>
<text x="96" y="756" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">POC start: one app + one workflow deployment.</text>
<text x="96" y="784" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Measure concurrency before sizing resources.</text>
<text x="88" y="952" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">MODEL + DATA SERVICES</text>
<text x="1344" y="952" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">FTA BACKEND</text>
<rect data-node-id="llm" x="96" y="992" width="400" height="192" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="120" y="1026" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">AI Inference + AI Registry</text>
<text x="120" y="1054" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Registry holds the chosen model version</text>
<text x="120" y="1078" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Inference serves the language model</text>
<text x="120" y="1102" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">GPU resources depend on model choice</text>
<text x="120" y="1126" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">One endpoint may serve several agent roles</text>
<rect data-node-id="warehouse" x="584" y="992" width="400" height="192" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="608" y="1026" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Data Warehouse / Impala</text>
<text x="608" y="1054" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Gold invoice, return and ledger tables</text>
<text x="608" y="1078" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Read-only validated SQL tool access</text>
<text x="608" y="1102" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Ranger policies / scoped data access</text>
<text x="608" y="1126" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">No arbitrary model-generated writes</text>
<rect data-node-id="case-actions" x="1096" y="992" width="408" height="192" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="1120" y="1026" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Case + approval + action API</text>
<text x="1120" y="1054" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Custom application/backend components</text>
<text x="1120" y="1078" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Durable case records and approval ledger</text>
<text x="1120" y="1102" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Demo submission APIs + status checks</text>
<text x="1120" y="1126" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Verify the effect; prevent duplicates</text>
<text x="64" y="1300" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" text-anchor="start">Read this in plain language</text>
<text x="64" y="1340" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Workbench runs our application and workflow code. AI Inference supplies language generation. Gold supplies factual records.</text>
<text x="64" y="1374" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Approved instruction files ship with the workflow release or load from controlled storage. RAG is added only for document lookup.</text>
<text x="64" y="1408" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Business effects go through a backend API. Gold remains an analytical source; case state is stored durably outside worker memory.</text>
<text x="64" y="1442" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A shared service account does not automatically become the visitor’s identity: enforce company scope in trusted tools and data policies.</text>
<text x="88" y="1548" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Example: Al Yasmeen asks “Why is my return different?”</text>
<text x="88" y="1584" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The CPU workflow loads guidance, calls the model to plan, queries Gold, calculates the gap and asks the model to explain the evidence.</text>
<text x="88" y="1612" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">An approved demo correction uses the backend API; the workflow reads the resulting state before reporting a verified outcome.</text>
<text x="64" y="1702" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Proposed placement, not an installed system or verified network design. Use an existing approved model endpoint instead of AI Inference if appropriate.</text>
<rect x="207.36" y="402" width="177.28" height="21" fill="#FFFFFF"/>
<text x="296" y="418" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.7">HTTPS / AUTHENTICATED</text>
<rect x="540.8" y="520" width="54.4" height="21" fill="#FFFFFF"/>
<text x="568" y="536" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.7">HTTPS</text>
<rect x="425.6" y="811" width="140.8" height="22" fill="#FFFFFF"/>
<text x="496" y="828" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.7">HTTPS / LLM API</text>
<rect x="821.44" y="839" width="149.12" height="22" fill="#FFFFFF"/>
<text x="896" y="856" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.7">SQL CLIENT / TLS</text>
<rect x="1229.44" y="863" width="149.12" height="22" fill="#FFFFFF"/>
<text x="1304" y="880" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.7">HTTPS / TOOL API</text></svg>
