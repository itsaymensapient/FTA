<text x="64" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">FTA / AGENTIC AI / GITEX / LEARNING GUIDE</text>
<text x="64" y="92" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">Understand the complete system</text>
<text x="64" y="128" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">You build the agent application that connects approved guidance, trusted data and operational workflows.</text>
<text x="1536" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end" letter-spacing="1">PROPOSED · 23 NOV 2026</text>
<text x="88" y="232" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">01  VISITOR EXPERIENCE</text>
<text x="88" y="266" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Frontend / application team</text>
<text x="528" y="256" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Inspector briefing; Business company view</text>
<text x="528" y="285" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Six-step tracker, evidence panels and approvals</text>
<text x="1064" y="256" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">INPUT: question, selected case and user decision</text>
<text x="1064" y="285" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">OUTPUT: an explanation, a draft or an action preview</text>
<text x="88" y="392" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">02  TRUSTED REQUEST CONTEXT</text>
<text x="88" y="426" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Backend + platform + AI integration</text>
<text x="528" y="416" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Role, permitted company scope, case and period</text>
<text x="528" y="445" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Session ID and application-controlled demo clock</text>
<text x="1064" y="416" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">The visitor name is a greeting, not authorization.</text>
<text x="1064" y="445" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">A business question cannot expand company access.</text>
<text x="88" y="552" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">03  AGENT APPLICATION</text>
<text x="88" y="586" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">YOU / AI ENGINEER</text>
<text x="528" y="576" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Supervisor, instruction loader and specialist tasks</text>
<text x="528" y="605" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Data, calculation, knowledge, explanation and actions</text>
<text x="1064" y="576" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">INPUT: scoped goal + approved instruction sections</text>
<text x="1064" y="605" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">OUTPUT: evidence-backed answer or proposed action</text>
<text x="88" y="712" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">04  EXECUTION AND STATE</text>
<text x="88" y="746" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">AI adapters + backend / data owners</text>
<text x="528" y="736" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Read-only SQL, certified rules and calculations</text>
<text x="528" y="765" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Approval checks, case transitions and event history</text>
<text x="1064" y="736" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">The model requests a tool; the tool checks authority.</text>
<text x="1064" y="765" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Records and task state survive role switching.</text>
<text x="88" y="872" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">05  RECORDS AND EVIDENCE</text>
<text x="88" y="906" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Data engineering + domain owners</text>
<text x="528" y="896" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Synthetic invoices, ledger, returns and registrations</text>
<text x="528" y="925" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Approved rule descriptions, letters and documents</text>
<text x="1064" y="896" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Stable IDs link every finding to its source records.</text>
<text x="1064" y="925" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Expected totals form the reference test dataset.</text>
<text x="88" y="1032" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">06  CLOUDERA ENVIRONMENT</text>
<text x="88" y="1066" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Cloudera / infrastructure team</text>
<text x="528" y="1056" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Workbench development and model-serving endpoints</text>
<text x="528" y="1085" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Agent orchestration and governed data connections</text>
<text x="1064" y="1056" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Candidate services depend on the target release.</text>
<text x="1064" y="1085" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Our custom logic still needs implementation and tests.</text>
<text x="64" y="1216" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Core distinction</text>
<text x="64" y="1252" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The model interprets language. Your application defines the workflow. Tools establish facts and execute approved effects.</text>
<text x="64" y="1296" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Proposed responsibility split. Confirm owners, interfaces and deployment support before committing to delivery.</text>
<text x="88" y="1372" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WORKED EXAMPLE / READ FROM TOP TO BOTTOM</text>
<text x="88" y="1408" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">One question travelling through the whole system</text>
<text x="88" y="1446" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Al Yasmeen asks: “Why is my return different from the invoice records?”</text>
<text x="88" y="1514" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">STEP / WHO ACTS</text>
<text x="360" y="1514" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WHAT THEY ACTUALLY DO</text>
<text x="1032" y="1514" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WHAT COMES BACK / WHY IT MATTERS</text>
<text x="88" y="1567" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">01</text>
<text x="136" y="1566" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Business user</text>
<text x="360" y="1564" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Opens Al Yasmeen’s selected return case and asks the question.</text>
<text x="1032" y="1564" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A question linked to the selected company and</text>
<text x="1032" y="1589" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">case.</text>
<text x="88" y="1687" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">02</text>
<text x="136" y="1686" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Application backend</text>
<text x="360" y="1684" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Attaches the permitted company, user role and selected period. It</text>
<text x="360" y="1709" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">takes these from the application session.</text>
<text x="1032" y="1684" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Trusted scope. Typing another company name</text>
<text x="1032" y="1709" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">cannot grant access.</text>
<text x="88" y="1807" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">03</text>
<text x="136" y="1806" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Supervisor Agent</text>
<text x="360" y="1804" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Loads approved reconciliation instructions, then plans: get</text>
<text x="360" y="1829" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">records, calculate differences, check evidence, explain.</text>
<text x="1032" y="1804" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A bounded task list with permitted tools and</text>
<text x="1032" y="1829" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">required evidence.</text>
<text x="88" y="1927" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">04</text>
<text x="136" y="1926" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Data + Calculation</text>
<text x="360" y="1924" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Data workflow retrieves permitted records. Calculation tool</text>
<text x="360" y="1949" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">compares expected VAT with declared VAT.</text>
<text x="1032" y="1924" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Dubai +486,200; Abu Dhabi −74,200; net +412,000</text>
<text x="1032" y="1949" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">AED.</text>
<text x="88" y="2047" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">05</text>
<text x="136" y="2046" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Explanation workflow</text>
<text x="360" y="2044" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Uses the returned figures and invoice references to explain the 34</text>
<text x="360" y="2069" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">cut-off and 4 allocation invoices.</text>
<text x="1032" y="2044" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A plain-language explanation with links to its</text>
<text x="1032" y="2069" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">supporting records.</text>
<text x="88" y="2167" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">06</text>
<text x="136" y="2166" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Application + platform</text>
<text x="360" y="2164" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The configured model endpoint supplies language generation; the app</text>
<text x="360" y="2189" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">displays the answer and saves the case history.</text>
<text x="1032" y="2164" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The visitor sees the answer. Shared case state</text>
<text x="1032" y="2189" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">survives a role switch.</text>
<text x="64" y="2294" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">What to remember</text>
<text x="64" y="2326" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">You connect the language model to reliable records and approved workflows; the platform alone does not supply the business logic.</text>
<text x="64" y="2374" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Worked examples use the supplied synthetic draft. Tool behavior and interfaces are proposed; these are not live taxpayer operations.</text>
</svg></div></main></body></html>
