<text x="64" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">FTA / AGENTIC AI / GITEX / LEARNING GUIDE</text>
<text x="64" y="92" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">Trace Scenario 2 from question to evidence</text>
<text x="64" y="128" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Al Yasmeen: the draft expects a Dubai increase, an Abu Dhabi decrease and an AED 412,000 net gap.</text>
<text x="1536" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end" letter-spacing="1">PROPOSED · 23 NOV 2026</text>

<text x="88" y="1212" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Working that comes from tools</text>
<text x="88" y="1252" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Dubai: 1,626,200 − 1,140,000 = 486,200</text>
<text x="696" y="1252" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Abu Dhabi: 214,600 − 288,800 = −74,200</text>
<text x="88" y="1284" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Net: 486,200 − 74,200 = AED 412,000. The explanation must identify the supporting records.</text>
<text x="64" y="1360" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Draft scenario figures, not live taxpayer findings. This diagram ends before approval and submission; see the action flow.</text>
<text x="88" y="1444" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WORKED EXAMPLE / READ FROM TOP TO BOTTOM</text>
<text x="88" y="1480" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">A worked investigation with actual draft arithmetic</text>
<text x="88" y="1518" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">The user asks: “Is the full AED 486,200 Dubai difference extra VAT?”</text>
<text x="88" y="1586" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">STEP / WHO ACTS</text>
<text x="360" y="1586" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WHAT THEY ACTUALLY DO</text>
<text x="1032" y="1586" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WHAT COMES BACK / WHY IT MATTERS</text>
<text x="88" y="1639" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">01</text>
<text x="136" y="1638" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Supervisor Agent</text>
<text x="360" y="1636" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Recognizes a reconciliation question. Loads instructions and asks</text>
<text x="360" y="1661" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">the Data workflow for the selected return and its invoice evidence.</text>
<text x="1032" y="1636" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A scoped investigation. The question itself is</text>
<text x="1032" y="1661" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">not treated as proof.</text>
<text x="88" y="1759" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">02</text>
<text x="136" y="1758" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Data workflow</text>
<text x="360" y="1756" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Reads Dubai expected VAT 1,626,200 and declared VAT 1,140,000; Abu</text>
<text x="360" y="1781" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Dhabi expected 214,600 and declared 288,800.</text>
<text x="1032" y="1756" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Four source-backed amounts, with their period,</text>
<text x="1032" y="1781" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">currency and record IDs.</text>
<text x="88" y="1879" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">03</text>
<text x="136" y="1878" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Calculation tool</text>
<text x="360" y="1876" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Subtracts declared from expected for each Emirate: 1,626,200 −</text>
<text x="360" y="1901" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">1,140,000; 214,600 − 288,800.</text>
<text x="1032" y="1876" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Dubai +486,200; Abu Dhabi −74,200. These are</text>
<text x="1032" y="1901" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">signed adjustments.</text>
<text x="88" y="1999" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">04</text>
<text x="136" y="1998" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Investigation task</text>
<text x="360" y="1996" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Checks the invoice breakdown: 34 cut-off invoices account for</text>
<text x="360" y="2021" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">412,000; 4 allocation invoices account for 74,200.</text>
<text x="1032" y="1996" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">38 supporting invoices. Allocation changes move</text>
<text x="1032" y="2021" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">VAT between Emirate boxes.</text>
<text x="88" y="2119" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">05</text>
<text x="136" y="2118" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Calculation tool</text>
<text x="360" y="2116" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Adds the signed box adjustments: 486,200 + (−74,200). Checks that</text>
<text x="360" y="2141" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">the invoice breakdown reconciles.</text>
<text x="1032" y="2116" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Net extra VAT in the draft: AED 412,000. The</text>
<text x="1032" y="2141" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">allocation is not counted twice.</text>
<text x="88" y="2239" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">06</text>
<text x="136" y="2238" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">Explanation workflow</text>
<text x="360" y="2236" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Answers: “Dubai increases by 486,200, but Abu Dhabi decreases by</text>
<text x="360" y="2261" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">74,200. The net increase is 412,000.” Offers an action preview.</text>
<text x="1032" y="2236" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A checkable answer and an optional draft.</text>
<text x="1032" y="2261" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Nothing is submitted by this answer.</text>
<text x="64" y="2366" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">What to remember</text>
<text x="64" y="2398" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A good agent separates the net shortfall from a movement between boxes. Repeating one large number would give the wrong explanation.</text>
<text x="64" y="2446" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Worked examples use the supplied synthetic draft. Tool behavior and interfaces are proposed; these are not live taxpayer operations.</text>
