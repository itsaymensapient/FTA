<rect data-node-id="worked-row-1" x="64" y="1652" width="1472" height="120" rx="0" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<rect data-node-id="worked-row-2" x="64" y="1772" width="1472" height="120" rx="0" fill="#F5F7F8" stroke="#D8E0E5" stroke-width="1.25"/>
<rect data-node-id="worked-row-3" x="64" y="1892" width="1472" height="120" rx="0" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<rect data-node-id="worked-row-4" x="64" y="2012" width="1472" height="120" rx="0" fill="#F5F7F8" stroke="#D8E0E5" stroke-width="1.25"/>
<rect data-node-id="worked-row-5" x="64" y="2132" width="1472" height="120" rx="0" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<path data-edge-id="stage-0" d="M 480 316 L 480 376" fill="none" stroke="#536674" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#learn-07-build-test-learn-07-build-test-arrow)"/>
<path data-edge-id="stage-1" d="M 480 508 L 480 568" fill="none" stroke="#536674" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#learn-07-build-test-learn-07-build-test-arrow)"/>
<path data-edge-id="stage-2" d="M 480 700 L 480 760" fill="none" stroke="#536674" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#learn-07-build-test-learn-07-build-test-arrow)"/>
<path data-edge-id="stage-3" d="M 480 892 L 480 952" fill="none" stroke="#536674" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#learn-07-build-test-learn-07-build-test-arrow)"/>
<text x="64" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">FTA / AGENTIC AI / GITEX / LEARNING GUIDE</text>
<text x="64" y="92" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">What you build and how you prove it works</text>
<text x="64" y="128" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Start with one complete vertical slice, then reuse the contracts and workflows across the remaining stories.</text>
<text x="1536" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end" letter-spacing="1">PROPOSED · 23 NOV 2026</text>
<text x="64" y="216" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">1 / DEFINE THE CONTRACTS</text>
<text x="64" y="256" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Agree role scope, scenario state and data IDs</text>
<text x="64" y="288" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Get approved business rules and reference totals</text>
<rect data-node-id="deliverable-0" x="864" y="212" width="672" height="128" rx="6" fill="#F5F7F8" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="888" y="256" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Outputs: data dictionary; tool input/output schemas</text>
<text x="888" y="288" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Test: every displayed figure has an authoritative source</text>
<text x="64" y="408" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">2 / BUILD ONE SCENARIO</text>
<text x="64" y="448" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Implement section loading, agents and deterministic tools</text>
<text x="64" y="480" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Use Scenario 2 as a proposed first complete example</text>
<rect data-node-id="deliverable-1" x="864" y="404" width="672" height="128" rx="6" fill="#EEF7F4" stroke="#14665E" stroke-width="1.25"/>
<text x="888" y="448" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Outputs: query → calculation → evidence → explanation</text>
<text x="888" y="480" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Test: AED 412,000 net gap and each box adjustment match</text>
<text x="64" y="600" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">3 / ADD APPROVED ACTIONS</text>
<text x="64" y="640" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Connect previews to demo APIs and persistent case state</text>
<text x="64" y="672" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Reconcile after submission; simulate follow-up events</text>
<rect data-node-id="deliverable-2" x="864" y="596" width="672" height="128" rx="6" fill="#F5F7F8" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="888" y="640" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Outputs: approval record; operation ID; shared history</text>
<text x="888" y="672" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Test: cancel does nothing; repeated approval does not duplicate</text>
<text x="64" y="792" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">4 / REUSE AND EXTEND</text>
<text x="64" y="832" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Add invoice, refund and period-allocation configurations</text>
<text x="64" y="864" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Expose the same engine through Inspector and Business</text>
<rect data-node-id="deliverable-3" x="864" y="788" width="672" height="128" rx="6" fill="#F5F7F8" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="888" y="832" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Outputs: scenario sections; approved action options</text>
<text x="888" y="864" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Test: both views agree; company boundaries remain enforced</text>
<text x="64" y="984" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">5 / REHEARSE AND OPERATE</text>
<text x="64" y="1024" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Deploy on the agreed Cloudera environment and model</text>
<text x="64" y="1056" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Trace latency, tool errors and evidence quality; rehearse reset</text>
<rect data-node-id="deliverable-4" x="864" y="980" width="672" height="128" rx="6" fill="#F5F7F8" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="888" y="1024" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Outputs: deployment settings; evaluation report; demo runbook</text>
<text x="888" y="1056" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Test: timeout, missing evidence, role switch and session reset</text>
<text x="64" y="1288" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">This is an implementation sequence, not a committed schedule. Feasibility depends on the deadline, people, data and platform readiness.</text>
<text x="88" y="1372" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WORKED EXAMPLE / READ FROM TOP TO BOTTOM</text>
<text x="88" y="1408" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">What you would actually build as the junior AI engineer</text>
<text x="88" y="1446" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Your first assignment: “Make the Al Yasmeen question work from input to verified output.”</text>
<text x="88" y="1514" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">STEP / WHO ACTS</text>
<text x="360" y="1514" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WHAT THEY ACTUALLY DO</text>
<text x="1032" y="1514" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">WHAT COMES BACK / WHY IT MATTERS</text>
<text x="88" y="1567" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">01</text>
<text x="136" y="1566" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">You + data owner</text>
<text x="360" y="1564" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Ask for the synthetic return and invoice records, stable IDs,</text>
<text x="360" y="1589" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">permitted scope and expected box adjustments. Agree the tool</text>
<text x="360" y="1614" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">response format.</text>
<text x="1032" y="1564" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A small reference dataset and a written</text>
<text x="1032" y="1589" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">input/output contract, not just screenshots.</text>
<text x="88" y="1687" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">02</text>
<text x="136" y="1686" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">You + domain owner</text>
<text x="360" y="1684" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Write the reconciliation instruction section. Implement a read-only</text>
<text x="360" y="1709" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">data tool and a deterministic calculation tool with approved</text>
<text x="360" y="1734" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">definitions.</text>
<text x="1032" y="1684" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Example tool result: Dubai +486,200; Abu Dhabi</text>
<text x="1032" y="1709" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">−74,200; net +412,000; source IDs.</text>
<text x="88" y="1807" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">03</text>
<text x="136" y="1806" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">You / orchestration</text>
<text x="360" y="1804" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Configure the supervisor to load instructions, delegate the</text>
<text x="360" y="1829" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">data/calculation work and return the evidence to an explanation</text>
<text x="360" y="1854" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">task.</text>
<text x="1032" y="1804" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The question produces a supported explanation.</text>
<text x="1032" y="1829" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Traces show which tools and sections were used.</text>
<text x="88" y="1927" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">04</text>
<text x="136" y="1926" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">You + backend team</text>
<text x="360" y="1924" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Connect the action preview, approval record, demo submission API</text>
<text x="360" y="1949" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">and persistent case history. Add post-submission verification.</text>
<text x="1032" y="1924" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A complete demo path: ask → explain → preview →</text>
<text x="1032" y="1949" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">approve → submit → verify.</text>
<text x="88" y="2047" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">05</text>
<text x="136" y="2046" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">You / evaluation</text>
<text x="360" y="2044" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Check the known amounts; ask for another company; remove an</text>
<text x="360" y="2069" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">evidence record; cancel approval; submit twice; simulate a timeout.</text>
<text x="1032" y="2044" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Correct figures; access blocked; missing</text>
<text x="1032" y="2069" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">evidence stated; no cancelled or duplicate</text>
<text x="1032" y="2094" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">effect.</text>
<text x="88" y="2167" fill="#14665E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">06</text>
<text x="136" y="2166" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">You + platform team</text>
<text x="360" y="2164" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Connect the agreed model endpoint and governed data access on</text>
<text x="360" y="2189" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Cloudera. Rehearse both roles and the session reset, then reuse the</text>
<text x="360" y="2214" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">workflow.</text>
<text x="1032" y="2164" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A repeatable demo with measured errors and</text>
<text x="1032" y="2189" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">latency. No new ML training is needed just to</text>
<text x="1032" y="2214" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">subtract these amounts.</text>
<text x="64" y="2294" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">What to remember</text>
<text x="64" y="2326" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Begin with one working path and known expected results. Add failure cases and reuse the tested building blocks for the other scenarios.</text>
<text x="64" y="2374" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Worked examples use the supplied synthetic draft. Tool behavior and interfaces are proposed; these are not live taxpayer operations.</text>
</svg>
