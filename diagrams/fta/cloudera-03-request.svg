<text x="64" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.7">FTA / AGENTIC AI / CLOUDERA / HOSTING GUIDE</text>
<text x="64" y="92" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">One hosted request, from question to verified action</text>
<text x="64" y="128" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Worked example: Al Yasmeen return reconciliation. The scenario figures are from the supplied synthetic GITEX draft.</text>
<text x="1536" y="40" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end" letter-spacing="1">PROPOSED · 23 NOV 2026</text>
<text x="88" y="216" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The app starts a workflow and gets a trace ID. It retrieves run events/results; the durable business case has its own separate ID.</text>
<rect data-node-id="actor-0" x="64" y="268" width="288" height="64" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="88" y="302" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">UI + server adapter</text>
<rect data-node-id="actor-1" x="408" y="268" width="288" height="64" rx="6" fill="#EEF7F4" stroke="#14665E" stroke-width="1.25"/>
<text x="432" y="302" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Agent workflow / CPU</text>
<rect data-node-id="actor-2" x="752" y="268" width="288" height="64" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="776" y="302" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">LLM endpoint</text>
<rect data-node-id="actor-3" x="1096" y="268" width="288" height="64" rx="6" fill="#FFFFFF" stroke="#D8E0E5" stroke-width="1.25"/>
<text x="1120" y="302" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Scoped tools / backend</text>
<text x="88" y="1470" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">What the tool contracts mean in this example</text>
<text x="88" y="1512" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Read selected return: trusted company + period → authorized amounts, invoice IDs and a record snapshot.</text>
<text x="88" y="1546" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Reconcile return: those records + approved definition → signed box adjustments and AED 412,000 net difference.</text>
<text x="88" y="1580" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Submit demo change: exact payload + valid approval + unique operation key → one trackable operation.</text>
<text x="88" y="1614" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Verify change: operation ID + refreshed records → verified, pending or failed; the LLM cannot choose the status.</text>
<text x="64" y="1722" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">A human pause is persisted in application case state; do not assume Agent Studio provides a complete approval/case-management system.</text>
<rect x="177.28" y="1009" width="445.44" height="20" fill="#FFFFFF"/>
<text x="400" y="1024" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.7">OPT / ACTION PATH ONLY IF THE USER APPROVES THE EXACT PREVIEW</text>
<rect x="188.32" y="357" width="383.36" height="23" fill="#FFFFFF"/>
<text x="380" y="375" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">1  Start: scoped question + selected case</text>
<rect x="505.44" y="437" width="437.12" height="23" fill="#FFFFFF"/>
<text x="724" y="455" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">2  Approved instructions + goal: propose a plan</text>
<rect x="527.84" y="517" width="392.32" height="23" fill="#FFFFFF"/>
<text x="724" y="535" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">3  Proposed plan; application validates it</text>
<rect x="659.52" y="597" width="472.96000000000004" height="23" fill="#FFFFFF"/>
<text x="896" y="615" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">4  Read Gold evidence; run certified reconciliation</text>
<rect x="681.92" y="677" width="428.16" height="23" fill="#FFFFFF"/>
<text x="896" y="695" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">5  Evidence IDs; +486,200 / −74,200 / +412,000</text>
<rect x="483.03999999999996" y="757" width="481.92" height="23" fill="#FFFFFF"/>
<text x="724" y="775" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">6  Explain these results; cite the supplied evidence</text>
<rect x="500.96000000000004" y="837" width="446.08" height="23" fill="#FFFFFF"/>
<text x="724" y="855" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">7  Draft explanation; application checks support</text>
<rect x="174.88" y="917" width="410.24" height="23" fill="#FFFFFF"/>
<text x="380" y="935" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">8  Show explanation and a correction preview</text>
<rect x="210.72" y="1037" width="338.56" height="23" fill="#FFFFFF"/>
<text x="380" y="1055" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">9  Approve the exact preview version</text>
<rect x="672.96" y="1117" width="446.08" height="23" fill="#FFFFFF"/>
<text x="896" y="1135" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">10  Backend checks approval; submits demo change</text>
<rect x="655.04" y="1197" width="481.92" height="23" fill="#FFFFFF"/>
<text x="896" y="1215" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">11  Operation status + refreshed-record verification</text>
<rect x="188.32" y="1277" width="383.36" height="23" fill="#FFFFFF"/>
<text x="380" y="1295" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.7">12  Verified outcome + shared case status</text></svg>
