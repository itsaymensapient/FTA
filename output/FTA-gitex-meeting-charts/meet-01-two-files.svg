<text x="856" y="254" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">Data Model v1.2 — the stockroom</text>
<text x="856" y="282" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">21 tables + field dictionary</text>
<text x="856" y="306" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Rules R01–R13 (numbers in code)</text>
