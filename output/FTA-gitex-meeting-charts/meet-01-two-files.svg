<text x="1228" y="562" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Send · Submit · Close</text>
<text x="1228" y="586" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Nothing leaves without this</text>
<text x="64" y="720" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">Core rule</text>
<text x="64" y="756" fill="#182C3A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">CDP / rules produce numbers. The agent writes plain language from tool results. People decide.</text>
<text x="64" y="920" fill="#536674" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Stand design from Scenario v2.9 and Data Model v1.2. Synthetic data. Not a live FTA deployment.</text>
